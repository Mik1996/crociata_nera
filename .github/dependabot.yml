# Weekly dependency updates, grouped to keep the pull requests few: one per ecosystem and folder,
# minor and patch versions only (major versions are ignored: they are upgraded by hand, with the
# code changes they need). Every PR runs the CI tests; merging it into master deploys it like any
# other push.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      backend:
        update-types: [minor, patch]

  # Base images of deploy/*.Dockerfile (node, caddy).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      docker-images:
        update-types: [minor, patch]

  # Images of deploy/docker-compose.yml (the backup tools: mongo, alpine).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      compose-images:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns: ['*']
