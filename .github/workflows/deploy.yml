# Tests every push and pull request (frontend, backend and end-to-end in parallel); a push to master
# that passes all three is published on the VPS (https://crociatanera.it) by running deploy/deploy.sh
# over SSH with the tested commit.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST         public IP of the VPS
#   VPS_SSH_KEY      private key dedicated to GitHub Actions (on the server it may only run deploy.sh)
#   VPS_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <VPS_HOST>` (protects against fake servers)

name: CI & Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at the same time; a new push waits for the running one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: false

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
      # Known vulnerabilities of the runtime dependencies: reported, not blocking yet.
      - name: Audit (runtime dependencies)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      # Angular's build cache is off on CI by default: switched on for this checkout only, and kept
      # between runs (one entry per commit, the newest one of the same lockfile restored).
      - name: Enable the Angular build cache
        run: npx ng config cli.cache.environment all
      - uses: actions/cache@v6
        with:
          path: .angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Colours only from the palette
        run: npm run lint:colors
      - name: Sizes in rem, no hard-coded pixels
        run: npm run lint:units
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build --configuration production

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci --no-audit --no-fund
      # Known vulnerabilities of the runtime dependencies: reported, not blocking yet.
      - name: Audit (runtime dependencies)
        working-directory: backend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        working-directory: backend
        run: npm run typecheck
      - name: Tests
        working-directory: backend
        run: npm test

  # End-to-end tests (e2e/README.md): production builds of both apps against an isolated stack
  # (MongoDB in memory, fake Clash of Clans API, SMTP sink; its servers can open no outbound
  # connection), started by Playwright. No secret is needed: the stack makes its own. Chromium
  # (desktop + phone); Firefox/WebKit run locally with `npm run test:e2e:cross`.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm --prefix backend ci --no-audit --no-fund
      # Playwright runs the tests without checking their types: done here, before the slow builds.
      - name: Type check (e2e code and stack)
        run: npm run typecheck:e2e

      - name: Enable the Angular build cache
        run: npx ng config cli.cache.environment all
      - uses: actions/cache@v6
        with:
          path: .angular/cache
          key: angular-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: angular-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # MongoDB binary of mongodb-memory-server (also used by the backend tests).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Browsers
        run: npx playwright install --with-deps chromium
      - name: Production builds
        run: npm run e2e:build
      - name: End-to-end tests
        run: npm run test:e2e

      # Report, traces, screenshots and videos of failed tests, logs of the stack's servers.
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/.artifacts
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy to crociatanera.it
    needs: [frontend, backend, e2e]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run deploy.sh on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted on the server to `command="…/deploy.sh"`: no shell, no forwarding.
          # The commit tested above is the ssh command: deploy.sh reads it from SSH_ORIGINAL_COMMAND
          # and deploys exactly that commit, even if master has moved on meanwhile. deploy.sh exits
          # with an error (after rolling back to the previous images) if the containers do not
          # become healthy.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "root@$VPS_HOST" "$GITHUB_SHA"

      - name: Health check
        run: |
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors https://crociatanera.it/api/v1/health
          echo
          curl -fsS -o /dev/null https://crociatanera.it/ && echo "Site OK"
