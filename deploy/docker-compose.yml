# Production stack on the VPS. Start/update with ./deploy.sh (see README "Pubblicazione").
# Only Caddy (web) is reachable from the internet; the backend stays on the internal network.

name: crociata-nera

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  web:
    # Tagged per commit by deploy.sh, which points `current` at the deployed one (rollback.sh moves it
    # back). IMAGE_TAG is set only by deploy.sh while building.
    image: crociata-nera-web:${IMAGE_TAG:-current}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # 1 = service worker switched off in the browsers (emergency, see README "Service worker").
        SW_DISABLED: ${SW_DISABLED:-0}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Plain order, not `condition: service_healthy`: while the backend starts (or if it never gets
    # healthy) Caddy keeps serving the app, which shows its offline/error states, instead of the
    # whole site going down; deploy.sh checks the health of both after `up`.
    depends_on:
      - backend
    # Liveness: Caddy's admin API (local to the container) answers.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Running container only (the image builds have their own heap, see the Dockerfiles). Caddy
    # serving static files and proxying needs a few tens of MB.
    mem_limit: 256m
    logging: *logging

  backend:
    image: crociata-nera-backend:${IMAGE_TAG:-current}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      FRONTEND_URL: https://${DOMAIN}
      CLAN_TAG: ${CLAN_TAG:-#2J8JVVCLC}
      COC_API_TOKEN: ${COC_API_TOKEN:?set COC_API_TOKEN in deploy/.env}
      WAR_SYNC_INTERVAL_MINUTES: ${WAR_SYNC_INTERVAL_MINUTES:-10}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      APP_URL: https://${DOMAIN}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    # Liveness, not readiness: any HTTP answer counts. /api/v1/health answers 503 when MongoDB or
    # the war sync is degraded, which restarting or rolling back the backend would not fix. The
    # image has no curl: node's fetch.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health', { signal: AbortSignal.timeout(8000) }).then(() => process.exit(0), () => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Running container only (the build has its own 1.5 GB heap, see backend.Dockerfile): Next.js
    # plus sharp re-encoding a 10 MB screenshot stays well below; Node sizes its heap to the limit.
    mem_limit: 1g
    logging: *logging

  # One-off tools of backup.sh (and of the restore, see README "Backup"), run with
  # `docker compose run --rm -T <service> …`: the `tools` profile keeps them out of `up`. Declared
  # here so that their images are pinned and updated by Dependabot like the others.
  mongo-tools:
    image: mongo:8.0.38
    profiles: [tools]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}

  archive-tools:
    image: alpine:3.24.4
    profiles: [tools]
    network_mode: none
    volumes:
      - proxy_data:/data:ro

volumes:
  caddy_data:
  caddy_config:
  # Archive of the old Clash of Clans proxy (retired: the backend serves every datum). No service
  # uses it any more; kept, and backed up by backup.sh, until its wars are imported or discarded.
  proxy_data:
