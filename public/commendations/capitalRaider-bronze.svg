<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 76" width="64" height="76">
  <!-- Commendation medal: Capital raider (bronze) -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd2a1"/>
      <stop offset="0.55" stop-color="#c77a3a"/>
      <stop offset="1" stop-color="#5e2f0d"/>
    </linearGradient>
    <linearGradient id="inner" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd2a1"/>
      <stop offset="1" stop-color="#c77a3a"/>
    </linearGradient>
  </defs>
  <!-- Ribbon tails -->
  <path d="M18 44 L12 72 L20 67 L25 74 L30 50 Z" fill="#00897b" stroke="#0b1220" stroke-width="2" stroke-linejoin="round"/>
  <path d="M46 44 L52 72 L44 67 L39 74 L34 50 Z" fill="#00897b" stroke="#0b1220" stroke-width="2" stroke-linejoin="round"/>
  <!-- Medallion -->
  <circle cx="32" cy="30" r="27" fill="url(#metal)" stroke="#0b1220" stroke-width="2.5"/>
  <circle cx="32" cy="30" r="21.5" fill="url(#inner)" stroke="#5e2f0d" stroke-width="1.5"/>
  <!-- Emblem -->
  <g>
    <path d="M20 46 V22 H23.5 V16 H28 V20 H30 V16 H34 V20 H36 V16 H40.5 V22 H44 V46 Z" fill="#5e2f0d" stroke="#5e2f0d" stroke-width="1" stroke-linejoin="round"/>
    <path d="M28.5 46 V38.5 A3.5 3.5 0 0 1 35.5 38.5 V46 Z" fill="#ffd2a1"/>
    <rect x="25" y="27" width="3.5" height="4.5" rx="1" fill="#ffd2a1"/>
    <rect x="35.5" y="27" width="3.5" height="4.5" rx="1" fill="#ffd2a1"/>
  </g>
</svg>
