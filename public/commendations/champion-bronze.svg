  </defs>
  <!-- Ribbon tails -->
  <path d="M18 44 L12 72 L20 67 L25 74 L30 50 Z" fill="#7b3fc4" stroke="#0b1220" stroke-width="2" stroke-linejoin="round"/>
  <path d="M46 44 L52 72 L44 67 L39 74 L34 50 Z" fill="#7b3fc4" stroke="#0b1220" stroke-width="2" stroke-linejoin="round"/>
