  <circle cx="32" cy="30" r="21.5" fill="url(#inner)" stroke="#5e2f0d" stroke-width="1.5"/>
  <!-- Emblem -->
  <g>
    <path d="M18 38 L19.5 22 L26.5 29.5 L32 17 L37.5 29.5 L44.5 22 L46 38 Z" fill="#5e2f0d" stroke="#5e2f0d" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="18" y="39.5" width="28" height="4" rx="1.5" fill="#5e2f0d"/>
  </g>
</svg>
