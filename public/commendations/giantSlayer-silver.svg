<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 76" width="64" height="76">
  <!-- Commendation medal: Bane of Titans (silver) -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#b9c4d2"/>
      <stop offset="1" stop-color="#4a5568"/>
    </linearGradient>
    <linearGradient id="inner" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c4d2"/>
    </linearGradient>
  </defs>
  <!-- Ribbon tails -->
  <path d="M18 44 L12 72 L20 67 L25 74 L30 50 Z" fill="#b23a1e" stroke="#0b1220" stroke-width="2" stroke-linejoin="round"/>
  <path d="M46 44 L52 72 L44 67 L39 74 L34 50 Z" fill="#b23a1e" stroke="#0b1220" stroke-width="2" stroke-linejoin="round"/>
  <!-- Medallion -->
  <circle cx="32" cy="30" r="27" fill="url(#metal)" stroke="#0b1220" stroke-width="2.5"/>
  <circle cx="32" cy="30" r="21.5" fill="url(#inner)" stroke="#4a5568" stroke-width="1.5"/>
  <!-- Emblem -->
  <g>
    <path d="M32 13 L35.5 18 L35.5 36 L28.5 36 L28.5 18 Z" fill="#4a5568" stroke="#4a5568" stroke-width="1" stroke-linejoin="round"/>
    <rect x="23" y="36" width="18" height="4" rx="1.5" fill="#4a5568"/>
    <rect x="30" y="40" width="4" height="6" fill="#4a5568"/>
    <circle cx="32" cy="47.5" r="2.6" fill="#4a5568"/>
  </g>
</svg>
