<div crnScrollFade class="page__scroll page__scroll--bleed">
  <crn-page-header
    flush
    scene="candle"
    [kicker]="'kicker.admin' | translate"
    [title]="'baseModeration.title' | translate"
    [subtitle]="'baseModeration.subtitle' | translate"
  >
    <a mat-stroked-button routerLink="/admin">
      <crn-icon matButtonIcon name="arrow_back" />
      {{ 'baseModeration.backToAdmin' | translate }}
    </a>
  </crn-page-header>

  <div class="page__body">
    <nav
      mat-tab-nav-bar
      crnSwipeTabs
      class="tabs cn-tabs--sticky"
      [tabPanel]="panel"
      [attr.aria-label]="'baseModeration.title' | translate"
    >
      @for (t of tabs; track t.id) {
        <a
          mat-tab-link
          routerLink="."
          [queryParams]="{ tab: t.id === 'pending' ? null : t.id }"
          replaceUrl
          [active]="status() === t.status"
        >
          {{ 'baseModeration.tabs.' + t.id | translate }}
          @if (counts(); as c) {
            <span class="count cn-num" [class.count--alert]="t.status === 'PENDING' && c.PENDING">
              {{ c[t.status] }}
            </span>
          }
        </a>
      }
    </nav>

    <mat-tab-nav-panel #panel class="panel">
      <crn-load-state
        [loading]="list.isLoading() && !items().length"
        [error]="list.error()"
        [empty]="!items().length"
        [emptyIcon]="status() === 'PENDING' ? 'check_circle' : 'inbox'"
        [emptyMessage]="'baseModeration.empty.' + status() | translate"
        (retry)="list.reload()"
      >
        <ul class="grid" [class.grid--stale]="list.isLoading()">
          @for (p of items(); track p.id) {
            <li>
              <crn-base-proposal-card
                class="card"
                showAuthor
                [proposal]="p"
                [imageUrl]="imageUrl(p)"
                (enlarge)="openImage(p)"
              >
                @if (p.status === 'PENDING') {
                  <div class="decisions">
                    <button
                      mat-flat-button
                      type="button"
                      class="approve"
                      (click)="decide(p, 'approve')"
                    >
                      <crn-icon matButtonIcon name="check_circle" />
                      {{ 'baseModeration.approve' | translate }}
                    </button>
                    <button
                      mat-stroked-button
                      type="button"
                      class="reject"
                      (click)="decide(p, 'reject')"
                    >
                      <crn-icon matButtonIcon name="block" />
                      {{ 'baseModeration.reject' | translate }}
                    </button>
                  </div>
                }
              </crn-base-proposal-card>
            </li>
          }
        </ul>
      </crn-load-state>
    </mat-tab-nav-panel>
  </div>
</div>
