<crn-confirm-dialog
  danger
  [title]="'admin.deleteDialog.title' | translate"
  [confirmLabel]="'admin.actions.delete' | translate"
  [busy]="busy()"
  [disabled]="!matches()"
  [errors]="errors()"
  (confirm)="submit()"
>
  <p class="intro">{{ 'admin.deleteDialog.intro' | translate: { name: data.user.username } }}</p>

  <mat-form-field appearance="outline" class="field">
    <mat-label>{{
      'admin.deleteDialog.label' | translate: { name: data.user.username }
    }}</mat-label>
    <input
      matInput
      name="username"
      autocomplete="off"
      spellcheck="false"
      cdkFocusInitial
      [value]="typed()"
      (input)="typed.set($any($event.target).value)"
    />
  </mat-form-field>
</crn-confirm-dialog>
