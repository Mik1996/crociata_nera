<crn-confirm-dialog
  [title]="'admin.linkDialog.title' | translate: { name: data.user.username }"
  [confirmLabel]="'admin.actions.link' | translate"
  [busy]="busy()"
  [disabled]="!tags().length && !draft().trim()"
  [errors]="errors()"
  (confirm)="submit(input)"
>
  <p class="intro">{{ 'admin.linkDialog.intro' | translate }}</p>

  <mat-form-field appearance="outline" class="field">
    <mat-label>{{ 'admin.linkDialog.label' | translate }}</mat-label>
    <mat-chip-grid #grid [attr.aria-label]="'admin.linkDialog.label' | translate">
      @for (tag of tags(); track tag) {
        <mat-chip-row (removed)="remove(tag)">
          <span class="cn-num">{{ tag }}</span>
          <button
            matChipRemove
            type="button"
            [attr.aria-label]="'admin.linkDialog.remove' | translate: { tag }"
          >
            <crn-icon name="cancel" />
          </button>
        </mat-chip-row>
      }
      <input
        #input
        class="tag-input"
        placeholder="#ABC123"
        autocomplete="off"
        cdkFocusInitial
        [matChipInputFor]="grid"
        [matChipInputSeparatorKeyCodes]="separators"
        [matChipInputAddOnBlur]="true"
        (matChipInputTokenEnd)="add($event)"
        (input)="draft.set(input.value); invalid.set(null)"
      />
    </mat-chip-grid>
    <mat-hint>{{ 'admin.linkDialog.hint' | translate }}</mat-hint>
  </mat-form-field>

  @if (invalid(); as wrong) {
    <crn-form-errors [messages]="[{ key: 'admin.linkDialog.invalid', params: { tag: wrong } }]" />
  }
</crn-confirm-dialog>
