<crn-confirm-dialog
  [title]="'admin.unlinkDialog.title' | translate: { name: data.user.username }"
  [confirmLabel]="'admin.actions.unlink' | translate"
  [busy]="busy()"
  [disabled]="!selected().size"
  [errors]="errors()"
  (confirm)="submit()"
>
  <p class="intro">{{ 'admin.unlinkDialog.intro' | translate }}</p>

  <ul class="list">
    @for (p of players(); track p.tag) {
      <li>
        <mat-checkbox
          [checked]="selected().has(p.tag)"
          [disabled]="busy()"
          (change)="toggle(p.tag, $event.checked)"
        >
          <span class="cn-num">{{ p.tag }}</span>
          @if (!p.verified) {
            <span class="cn-muted unverified">{{ 'admin.tagUnverified' | translate }}</span>
          }
        </mat-checkbox>
      </li>
    }
  </ul>
</crn-confirm-dialog>
