<crn-confirm-dialog
  danger
  [title]="'bases.deleteDialog.title' | translate"
  [confirmLabel]="'bases.delete' | translate"
  [busy]="busy()"
  [errors]="errors()"
  (confirm)="confirm()"
>
  <img class="thumb" [src]="data.imageUrl" alt="" />
  <p class="intro">
    {{ 'bases.deleteDialog.intro' | translate: { n: data.base.townHallLevel } }}
  </p>
</crn-confirm-dialog>
