<crn-page-header scene="dusk" [kicker]="'kicker.join' | translate" [title]="'join.title' | translate" [subtitle]="'join.subtitle' | translate" />

<div crnScrollFade class="page__scroll" tabindex="0" role="region" [attr.aria-label]="'join.title' | translate">
  <crn-load-state [loading]="clan.isLoading() && !data()" [error]="clan.error()" [empty]="false" (retry)="clan.reload()">
    @if (data(); as c) {
      <crn-recruitment-banner class="join__banner" [clan]="c" [sisters]="sisters()" />
      <crn-clan-rules />
    }
  </crn-load-state>
</div>
