<div
  crnScrollFade
  class="page__scroll page__scroll--bleed"
  tabindex="0"
  role="region"
  [attr.aria-label]="'join.title' | translate"
>
  <crn-page-header
    flush
    scene="dusk"
    [kicker]="'kicker.join' | translate"
    [title]="'join.title' | translate"
    [subtitle]="'join.subtitle' | translate"
  />

  <div class="page__body">
    <crn-load-state
      [loading]="clan.isLoading() && !data()"
      [error]="clan.error()"
      [empty]="false"
      (retry)="clan.reload()"
    >
      @if (data(); as c) {
        <crn-recruitment-banner class="join__banner" [clan]="c" [sisters]="sisters()" />
        <crn-clan-rules />
      }
    </crn-load-state>
  </div>
</div>
