<app-page-header [title]="'join.title' | translate" [subtitle]="'join.subtitle' | translate" />

<div appScrollFade class="page__scroll" tabindex="0" role="region" [attr.aria-label]="'join.title' | translate">
  <app-load-state [loading]="clan.isLoading() && !data()" [error]="clan.error()" [empty]="false" (retry)="clan.reload()">
    @if (data(); as c) {
      <app-recruitment-banner class="join__banner" [clan]="c" />
      <app-clan-rules />
    }
  </app-load-state>
</div>
