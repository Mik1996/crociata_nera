<div crnScrollFade class="page__scroll page__scroll--bleed">
  <crn-page-header
    flush
    scene="war"
    [kicker]="'kicker.war' | translate"
    [title]="'nav.currentWar' | translate"
    [subtitle]="'currentWar.subtitle' | translate"
  >
    <button mat-stroked-button type="button" (click)="refresh()" [disabled]="resource.isLoading()">
      <crn-icon matButtonIcon name="refresh" /> {{ 'common.refresh' | translate }}
    </button>
    @if (war(); as w) {
      <crn-war-summary pageHero scenic [war]="w" />
    }
  </crn-page-header>

  <div class="page__body">
    <crn-load-state
      [loading]="resource.isLoading()"
      [error]="resource.error()"
      [empty]="!war()"
      emptyIcon="shield"
      [emptyMessage]="'currentWar.empty' | translate"
      (retry)="resource.reload()"
    >
      @if (war(); as w) {
        @if (kpi(); as k) {
          <div class="cn-grid-kpi">
            <crn-kpi-card
              [image]="GAME_ICONS.star"
              [label]="'common.averageStars' | translate"
              [value]="(k.averageStars | localNumber: '1.2-2') ?? '0'"
              [hint]="'common.perAttack' | translate"
            />
            <crn-kpi-card
              [image]="GAME_ICONS.star"
              [imageTriangle]="true"
              [label]="'common.threeStarAttacks' | translate"
              [value]="(k.threeStarRate | localNumber: '1.0-1') + '%'"
            />
            <crn-kpi-card
              icon="hourglass_empty"
              [label]="'currentWar.withoutAttacks' | translate"
              [value]="k.participantsWithoutAttacks"
              [hint]="'currentWar.outOfParticipants' | translate: { n: w.teamSize }"
            />
          </div>
        }

        <section class="cn-card cn-section" aria-labelledby="participants-title">
          <p class="cn-kicker">{{ 'currentWar.participantsKicker' | translate }}</p>
          <h2 id="participants-title">{{ 'currentWar.participants' | translate }}</h2>
          <crn-war-participants-table
            [rows]="rows()"
            [attacksPerMember]="w.attacksPerMember"
            [inProgress]="w.state !== 'ended'"
            [preparation]="w.state === 'preparation'"
          />
        </section>
      }
    </crn-load-state>
  </div>
</div>
