<h2 mat-dialog-title>{{ title() }}</h2>

<form (submit)="submit($event)">
  <mat-dialog-content>
    <ng-content />
    <crn-form-errors [messages]="errors()" />
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>{{ 'common.cancel' | translate }}</button>
    <button
      mat-flat-button
      type="submit"
      [crnButton]="danger() ? 'danger' : 'primary'"
      [disabled]="busy() || disabled()"
    >
      {{ confirmLabel() }}
    </button>
  </mat-dialog-actions>
</form>
