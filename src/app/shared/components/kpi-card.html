@if (image(); as image) {
  @if (imageTriangle()) {
    <span class="kpi__triangle" aria-hidden="true">
      @for (i of [0, 1, 2]; track i) {
        <img class="kpi__triangle-image" [src]="image" alt="" />
      }
    </span>
  } @else {
    <img
      class="kpi__image"
      [src]="image"
      [style.--kpi-image-zoom]="imageZoom()"
      alt=""
      aria-hidden="true"
    />
  }
} @else if (icon(); as icon) {
  <app-icon class="kpi__icon" [name]="icon" />
}
<div class="kpi__text">
  <span class="kpi__label">{{ label() }}</span>
  <span class="kpi__value">{{ value() }}</span>
  @if (hint()) {
    <span class="kpi__hint">{{ hint() }}</span>
  }
</div>
