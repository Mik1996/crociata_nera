<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  @if (selected()?.image; as src) {
    <img matPrefix class="select__image select__image--prefix" [src]="src" alt="" />
  } @else if (selected()?.icon ?? icon(); as name) {
    <crn-icon matPrefix [name]="name" />
  }
  <mat-select [value]="value()" [disabled]="disabled()" (valueChange)="value.set($event)">
    @for (option of options(); track $index) {
      <mat-option [value]="option.value">
        @if (option.image; as src) {
          <img class="select__image" [src]="src" alt="" />
        } @else if (option.icon; as name) {
          <crn-icon class="select__icon" [name]="name" />
        }
        {{ option.label }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>
