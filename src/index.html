<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Crociata Nera · Guerre di clan</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Statistiche e storico delle guerre del clan Crociata Nera (Clash of Clans).">
  <meta name="theme-color" content="#0f1729">
  <script>
    // Apply the saved theme (or the system one) before the app boots, to avoid a flash of the wrong theme.
    // Keep in sync with ThemeService (src/app/core/theme).
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('crociata-nera.theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
