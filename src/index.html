<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Crociata Nera · Guerre di clan</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Statistiche e storico delle guerre del clan Crociata Nera (Clash of Clans).">
  <!-- Initial browser UI colour (= --cn-bg of the default theme, before the styles load; ThemeService
       then reads it from the palette). Keep in sync with public/site.webmanifest. -->
  <meta name="theme-color" content="#0a0709">
  <script>
    // Apply the saved theme (or the default one) before the app boots, to avoid a flash of the wrong theme.
    // Keep in sync with THEMES / DEFAULT_THEME (src/app/core/theme/themes.ts).
    (function () {
      var themes = ['iron', 'steel'];
      var theme = null;
      try { theme = localStorage.getItem('crociata-nera.theme'); } catch (e) {}
      if (themes.indexOf(theme) < 0) theme = 'iron';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <!-- Clan badge. The app replaces the icon with the current badgeUrl from the API (Shell). -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
